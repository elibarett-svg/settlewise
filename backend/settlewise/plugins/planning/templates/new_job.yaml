    title: Have your Social Insurance Number ready for your employer
    category: government
    offset_days: -14
    priority: high
    source_ids: [esdc-sin]
  - key: know_rights
    title: Read the basics of employment standards in your province
    category: employment
    offset_days: -7
    priority: low
    when: {province: ["ON"]}
    source_ids: [ontario-esa]
  - key: commute
    title: Plan your commute and buy a transit pass if needed
    category: travel
    offset_days: -3
    priority: medium
