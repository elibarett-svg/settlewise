    category: tax
    offset_days: 0
    priority: high
    depends_on: [sin]
    external_party: Employer
    source_ids: [cra-td1]
  - key: direct_deposit
    title: Give your employer direct deposit details
    category: finance
    offset_days: 0
    priority: high
    external_party: Employer
  - key: benefits
    title: Enrol in workplace benefits before the deadline
    category: insurance
    offset_days: 30
    priority: high
    date_sensitive: true
    external_party: Employer benefits provider
  - key: update_budget
    title: Add your new income to your budget
    category: finance
    offset_days: 14
    priority: medium
costs:
  - {label: Monthly transit pass, category: travel, amount: 156, offset_days: 0}
