name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check settlewise tests scripts
      - run: ruff format --check settlewise tests scripts
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Advisory: expo-doctor also fails whenever Expo publishes a new patch release,
      # which is not a problem with this code. Fix with `npx expo install --fix`.
      - name: expo-doctor (advisory)
        run: npx expo-doctor
        continue-on-error: true
